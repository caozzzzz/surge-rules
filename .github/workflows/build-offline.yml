name: Build offline profile
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'surge.conf'
      - 'examples/subscription.list'
      - 'scripts/build-offline-profile.py'
      - 'rules/**'
      - '.github/workflows/build-offline.yml'
permissions:
  contents: write
concurrency:
  group: sync-surge-rules
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build offline profile
        run: python scripts/build-offline-profile.py
      - name: Commit offline profile
        shell: bash
        run: |
          git add surge-offline.conf
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: rebuild offline profile"
          git pull --rebase origin main
          git push origin HEAD:main
